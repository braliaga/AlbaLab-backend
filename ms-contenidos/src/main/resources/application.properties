spring.application.name=ms-contenidos
server.port=9091

# En Docker la URL llega por SPRING_DATASOURCE_URL (host "mysql" en vez de localhost).
spring.datasource.url=jdbc:mysql://localhost:3306/bd_contenidos?createDatabaseIfNotExist=true
spring.datasource.username=root
spring.datasource.password=${DB_PASSWORD:albalab}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

springdoc.swagger-ui.path=/doc/swagger-ui.html
